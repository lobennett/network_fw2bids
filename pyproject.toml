[project]
name = "network_fw2bids"
version = "0.1.0"
description = "Flywheel-to-BIDS conversion for the r01network project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dcm2niix>=1.0.20260724",
    "flywheel-sdk>=22.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_fw2bids"]
