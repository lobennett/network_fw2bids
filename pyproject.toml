[project]
name = "network_fw2bids"
version = "0.1.0"
description = "Flywheel-to-BIDS conversion for the r01network project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dcm2niix>=1.0.20260724",
    "flywheel-sdk>=22.4.0",
    "nibabel>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
network-fw2bids = "network_fw2bids.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_fw2bids"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/final_sample_subjects.txt", "/pyproject.toml", "/uv.lock"]
exclude = ["/.superpowers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
