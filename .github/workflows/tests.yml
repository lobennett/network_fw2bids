name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Use temporary environment and cache
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/project-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest -q -ra
      - name: Build package
        run: uv build
      - name: Check repository diff
        run: git diff --check
